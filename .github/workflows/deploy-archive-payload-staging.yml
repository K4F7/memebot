name: Deploy archive Payload staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch, or tag to deploy'
        required: false
        default: ''
        type: string
      create_fixture:
        description: 'Create a dedicated Work/Media fixture through Payload Admin'
        required: false
        default: true
        type: boolean
      run_koishi:
        description: 'Exercise the built memebot-archive adapter against staging'
        required: false
        default: true
        type: boolean
      exercise_rollback:
        description: 'Attempt a missing image and verify deploy.sh restores the previous image'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: staging-archive-payload
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/k4f7/memebot/archive-payload

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Payload dependencies
        working-directory: apps/archive-payload
        run: corepack yarn install --immutable

      - name: Typecheck Payload
        working-directory: apps/archive-payload
        run: corepack yarn typecheck

      - name: Test Payload
        working-directory: apps/archive-payload
        run: corepack yarn test

      - name: Build Payload
        working-directory: apps/archive-payload
        run: corepack yarn build

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/archive-payload
          push: true
          tags: ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

  deploy-and-accept:
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install repository dependencies and build Koishi adapter
        run: |
          corepack enable
          corepack yarn install --immutable
          corepack yarn build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_VPS_KNOWN_HOSTS }}
        run: |
          key_file="$RUNNER_TEMP/memebot-staging-deploy-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf 'DEPLOY_KEY=%s\n' "$key_file" >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pre-deploy staging acceptance
        env:
          MEMEBOT_ARCHIVE_STAGING_REQUIRED: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_ADMIN: ${{ inputs.create_fixture && '1' || '0' }}
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_FAILURE_FIXTURES: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_PRIVACY: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_MEDIA_EXPIRY: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_KOISHI: '1'
          MEMEBOT_ARCHIVE_STAGING_URL: ${{ vars.STAGING_ARCHIVE_URL }}
          MEMEBOT_ARCHIVE_STAGING_TOKEN: ${{ secrets.STAGING_ARCHIVE_SERVICE_TOKEN }}
          MEMEBOT_ARCHIVE_STAGING_MEDIA_SIGNING_SECRET: ${{ secrets.STAGING_ARCHIVE_MEDIA_SIGNING_SECRET }}
          MEMEBOT_ARCHIVE_STAGING_WORK_ID: ${{ vars.STAGING_ARCHIVE_WORK_ID }}
          MEMEBOT_ARCHIVE_STAGING_CREATE_FIXTURE: ${{ inputs.create_fixture && '1' || '0' }}
          MEMEBOT_ARCHIVE_STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ARCHIVE_ADMIN_EMAIL }}
          MEMEBOT_ARCHIVE_STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ARCHIVE_ADMIN_PASSWORD }}
          MEMEBOT_ARCHIVE_STAGING_KOISHI: ${{ inputs.run_koishi && '1' || '0' }}
          MEMEBOT_ARCHIVE_STAGING_STATE_FILE: ${{ runner.temp }}/archive-staging-state.json
          MEMEBOT_ARCHIVE_STAGING_OUTAGE_URL: ${{ vars.STAGING_ARCHIVE_OUTAGE_URL }}
          MEMEBOT_ARCHIVE_STAGING_FAILED_MEDIA_URL: ${{ vars.STAGING_ARCHIVE_FAILED_MEDIA_URL }}
          MEMEBOT_ARCHIVE_STAGING_FAILED_MEDIA_WORK_ID: ${{ vars.STAGING_ARCHIVE_FAILURE_WORK_ID }}
          MEMEBOT_ARCHIVE_STAGING_DIRECT_MEDIA_URL: ${{ vars.STAGING_ARCHIVE_DIRECT_MEDIA_URL }}
        run: node scripts/archive-staging-smoke.cjs

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
          VPS_APP_DIR: ${{ vars.STAGING_VPS_APP_DIR }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" "install -d -m 700 '$VPS_APP_DIR'"
          scp -i "$DEPLOY_KEY" -P "$VPS_PORT" -o IdentitiesOnly=yes \
            apps/archive-payload/deploy/compose.yml \
            apps/archive-payload/deploy/deploy.sh \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Inject staging runtime environment
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
          VPS_APP_DIR: ${{ vars.STAGING_VPS_APP_DIR }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ARCHIVE_ENV_FILE }}
        run: |
          printf '%s\n' "$STAGING_ENV_FILE" | \
            ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
              "$VPS_USER@$VPS_HOST" \
              "umask 077; cat > '$VPS_APP_DIR/.env'; chmod 600 '$VPS_APP_DIR/.env'"

      - name: Log in to GHCR on staging host
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.STAGING_GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
              "$VPS_USER@$VPS_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Activate staging image
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
          VPS_APP_DIR: ${{ vars.STAGING_VPS_APP_DIR }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.image_digest }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 750 '$VPS_APP_DIR/deploy.sh' && '$VPS_APP_DIR/deploy.sh' '$IMAGE_REF'"

      - name: Post-deploy staging acceptance
        env:
          MEMEBOT_ARCHIVE_STAGING_REQUIRED: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_FAILURE_FIXTURES: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_PRIVACY: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_MEDIA_EXPIRY: '1'
          MEMEBOT_ARCHIVE_STAGING_REQUIRE_KOISHI: '1'
          MEMEBOT_ARCHIVE_STAGING_URL: ${{ vars.STAGING_ARCHIVE_URL }}
          MEMEBOT_ARCHIVE_STAGING_TOKEN: ${{ secrets.STAGING_ARCHIVE_SERVICE_TOKEN }}
          MEMEBOT_ARCHIVE_STAGING_MEDIA_SIGNING_SECRET: ${{ secrets.STAGING_ARCHIVE_MEDIA_SIGNING_SECRET }}
          MEMEBOT_ARCHIVE_STAGING_WORK_ID: ''
          MEMEBOT_ARCHIVE_STAGING_CREATE_FIXTURE: '0'
          MEMEBOT_ARCHIVE_STAGING_KOISHI: ${{ inputs.run_koishi && '1' || '0' }}
          MEMEBOT_ARCHIVE_STAGING_STATE_FILE: ${{ runner.temp }}/archive-staging-state.json
          MEMEBOT_ARCHIVE_STAGING_OUTAGE_URL: ${{ vars.STAGING_ARCHIVE_OUTAGE_URL }}
          MEMEBOT_ARCHIVE_STAGING_FAILED_MEDIA_URL: ${{ vars.STAGING_ARCHIVE_FAILED_MEDIA_URL }}
          MEMEBOT_ARCHIVE_STAGING_FAILED_MEDIA_WORK_ID: ${{ vars.STAGING_ARCHIVE_FAILURE_WORK_ID }}
          MEMEBOT_ARCHIVE_STAGING_DIRECT_MEDIA_URL: ${{ vars.STAGING_ARCHIVE_DIRECT_MEDIA_URL }}
        run: node scripts/archive-staging-smoke.cjs

      - name: Exercise staging rollback (optional)
        if: inputs.exercise_rollback
        continue-on-error: true
        id: rollback
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
          VPS_APP_DIR: ${{ vars.STAGING_VPS_APP_DIR }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:staging-missing-${{ github.run_id }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 750 '$VPS_APP_DIR/deploy.sh' && '$VPS_APP_DIR/deploy.sh' '$IMAGE_REF'"

      - name: Verify rollback attempt failed as expected
        if: inputs.exercise_rollback
        run: test "${{ steps.rollback.outcome }}" = failure

      - name: Verify staging rollback health
        if: inputs.exercise_rollback
        env:
          VPS_HOST: ${{ vars.STAGING_VPS_HOST }}
          VPS_PORT: ${{ vars.STAGING_VPS_PORT }}
          VPS_USER: ${{ vars.STAGING_VPS_USER }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "curl --fail --silent --show-error http://127.0.0.1:13000/api/health >/dev/null"
