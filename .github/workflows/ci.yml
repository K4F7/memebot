name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn check:plugin-loads
      - name: Verify Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn install --immutable
      - name: Typecheck Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn typecheck
      - name: Test Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn test
      - name: Build Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn build
      - name: Validate Payload deployment files
        working-directory: apps/archive-payload
        run: |
          cp .env.example deploy/.env
          trap 'shred -u deploy/.env' EXIT
          IMAGE_REF=ghcr.io/k4f7/memebot/archive-payload:ci docker compose -f deploy/compose.yml config >/dev/null
          bash -n deploy/deploy.sh
      - name: Build Payload container
        run: docker build --tag memebot-archive-payload:ci apps/archive-payload
