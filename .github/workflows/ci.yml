name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn check:plugin-loads
      - run: yarn test
      - run: yarn build
      - name: Verify Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn install --immutable
      - name: Typecheck Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn typecheck
      - name: Test Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn test
      - name: Build Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn build
