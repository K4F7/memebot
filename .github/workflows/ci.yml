name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn check:plugin-loads
      - name: Verify Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn install --immutable
      - name: Typecheck Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn typecheck
      - name: Test Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn test
      - name: Build Payload archive app
        working-directory: apps/archive-payload
        run: corepack yarn build
      - name: Bundle Payload archive Worker
        working-directory: apps/archive-payload
        run: corepack yarn opennextjs-cloudflare build
