name: Publish plugin

on:
  push:
    tags:
      - "memebot-*-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: npm install -g npm@11.5.1

      - name: Verify publishing runtime
        run: |
          node -e '
            const { execSync } = require("node:child_process")
            function atLeast(actual, minimum) {
              const actualParts = actual.split(".").map(Number)
              const minimumParts = minimum.split(".").map(Number)
              for (let index = 0; index < 3; index += 1) {
                const left = actualParts[index] || 0
                const right = minimumParts[index] || 0
                if (left !== right) return left > right
              }
              return true
            }
            const nodeVersion = process.versions.node
            const npmVersion = execSync("npm -v", { encoding: "utf8" }).trim()
            if (!atLeast(nodeVersion, "22.14.0")) {
              console.error("Node " + nodeVersion + " is below the trusted-publishing minimum 22.14.0")
              process.exit(1)
            }
            if (!atLeast(npmVersion, "11.5.1")) {
              console.error("npm " + npmVersion + " is below the trusted-publishing minimum 11.5.1")
              process.exit(1)
            }
            console.log("Publishing runtime Node " + nodeVersion + ", npm " + npmVersion)
          '

      - run: yarn install --immutable

      - name: Resolve plugin from tag
        id: plugin
        shell: bash
        run: |
          for package_dir in plugins/memebot-*; do
            plugin="$(basename "$package_dir")"
            version="$(node -p "require('./${package_dir}/package.json').version")"

            if [[ "$GITHUB_REF_NAME" == "${plugin}-v${version}" ]]; then
              echo "directory=${package_dir}" >> "$GITHUB_OUTPUT"
              if [[ "$version" == *-* ]]; then
                prerelease="${version#*-}"
                echo "npm_tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
              else
                echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              fi
              echo "Publishing ${plugin} ${version}"
              exit 0
            fi
          done

          echo "Tag '${GITHUB_REF_NAME}' does not match a plugin and its package.json version." >&2
          echo "Expected format: <plugin-directory>-v<version> (for example, memebot-faq-v0.1.0)." >&2
          exit 1

      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn check:plugin-loads
      - run: yarn check:plugin-artifacts

      - name: Pack and validate selected artifact
        run: node scripts/check-plugin-artifacts.cjs --pack-selected "${{ steps.plugin.outputs.directory }}" --out "${{ runner.temp }}/selected-plugin.tgz"

      - name: Publish validated tarball
        run: npm publish "${{ runner.temp }}/selected-plugin.tgz" --access public --tag "${{ steps.plugin.outputs.npm_tag }}"
