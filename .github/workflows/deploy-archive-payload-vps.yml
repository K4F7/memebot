name: Deploy archive Payload to VPS

on:
  push:
    branches: [main]
    paths:
      - apps/archive-payload/**
      - .github/workflows/deploy-archive-payload-vps.yml
permissions: {}

concurrency:
  group: production-archive-payload
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/k4f7/memebot/archive-payload

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/archive-payload
        run: corepack yarn install --immutable

      - name: Typecheck
        working-directory: apps/archive-payload
        run: corepack yarn typecheck

      - name: Test
        working-directory: apps/archive-payload
        run: corepack yarn test

      - name: Build
        working-directory: apps/archive-payload
        run: corepack yarn build

  image:
    needs: verify
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/archive-payload
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          key_file="$RUNNER_TEMP/memebot-vps-deploy-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf 'DEPLOY_KEY=%s\n' "$key_file" >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" "install -d -m 700 '$VPS_APP_DIR'"
          scp -i "$DEPLOY_KEY" -P "$VPS_PORT" -o IdentitiesOnly=yes \
            apps/archive-payload/deploy/compose.yml \
            apps/archive-payload/deploy/deploy.sh \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Log in to GHCR on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
              "$VPS_USER@$VPS_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Activate release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.image_digest }}
        run: |
          ssh -i "$DEPLOY_KEY" -p "$VPS_PORT" -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 750 '$VPS_APP_DIR/deploy.sh' && '$VPS_APP_DIR/deploy.sh' '$IMAGE_REF'"
