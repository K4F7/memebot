services:
  archive-payload:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PAYLOAD_RUNTIME_MIGRATIONS: '1'
    ports:
      - 127.0.0.1:13000:3000
    networks:
      - 1panel-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  1panel-network:
    external: true
